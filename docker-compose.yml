services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data

  mailpit:
    image: axllent/mailpit:v1.27

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      BS_JWT_SECRET: ${BS_JWT_SECRET}
      BS_BOOTSTRAP_CEO_EMAIL: ${BS_BOOTSTRAP_CEO_EMAIL}
      BS_BOOTSTRAP_CEO_PASSWORD: ${BS_BOOTSTRAP_CEO_PASSWORD}
      BS_BOOTSTRAP_ADMIN_EMAIL: ${BS_BOOTSTRAP_ADMIN_EMAIL}
      BS_BOOTSTRAP_ADMIN_PASSWORD: ${BS_BOOTSTRAP_ADMIN_PASSWORD}
      BS_CORS_ALLOWED_ORIGINS: ${BS_CORS_ALLOWED_ORIGINS}
      BS_SECURE_COOKIES: ${BS_SECURE_COOKIES}
      BS_REVEAL_OTP: ${BS_REVEAL_OTP}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8080/api/v1
    ports:
      - "5173:80"

volumes:
  postgres_data:
  redis_data:
  minio_data:
