spring:
  application:
    name: brainserve-appointment
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/brainserve}
    username: ${SPRING_DATASOURCE_USERNAME:brainserve_app}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2s
  mvc:
    problemdetails:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

brainserve:
  security:
    jwt-secret: ${BS_JWT_SECRET:}
    access-token-ttl: 10m
    refresh-token-ttl: 14d
    allowed-origins: ${BS_CORS_ALLOWED_ORIGINS:http://localhost:5173}
    max-login-failures: 5
    lock-duration: 15m
    secure-cookies: ${BS_SECURE_COOKIES:false}
  development:
    reveal-otp: ${BS_REVEAL_OTP:false}
  bootstrap:
    ceo-email: ${BS_BOOTSTRAP_CEO_EMAIL:}
    ceo-password: ${BS_BOOTSTRAP_CEO_PASSWORD:}
    admin-email: ${BS_BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BS_BOOTSTRAP_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  observations:
    key-values:
      application: brainserve-appointment

springdoc:
  api-docs:
    path: /v3/api-docs
  scalar:
    path: /scalar

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%p service=brainserve correlationId=%X{correlationId:-none} logger=%logger{36} message=%msg%n"
