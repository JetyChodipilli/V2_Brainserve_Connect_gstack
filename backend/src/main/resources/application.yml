spring:
  application:
    name: brainserve-appointment
  datasource:
    url: jdbc:postgresql://localhost:5432/brainserve_clean
    username: brainserve_app
    password: postgres
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s
  mvc:
    problemdetails:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  web:
    error:
      include-message: never
      include-stacktrace: never

server:
  port: 8080
  shutdown: graceful

brainserve:
  security:
    jwt-secret: Q9z7hX2kLw8rT1vYc3pN5aJ0mE4sU6dR2fG8bH9qW1zK7xL0vP3tC5nM8yR4jV2
    access-token-ttl: 10m
    refresh-token-ttl: 14d
    allowed-origins: http://localhost:5173
    max-login-failures: 5
    lock-duration: 15m
    secure-cookies: true
  development:
    reveal-otp: true
  bootstrap:
    ceo-email: jety@brainserve.in
    ceo-password: Jety@BS#id06
    admin-email: jetychodipilli@gmail.com
    admin-password: SystemAdmin@BS#06

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  observations:
    key-values:
      application: brainserve-appointment

springdoc:
  api-docs:
    path: /v3/api-docs
  scalar:
    path: /scalar

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%p service=brainserve correlationId=%X{correlationId:-none} logger=%logger{36} message=%msg%n"
